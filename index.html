function Module({title,item}){if(title==='Döküman'&&docMeta[item])return h`<${DocumentStudio} type=${item}/>`;if(title==='Avatar'&&item==='Sesler')return h`<${VoiceStudio}/>`;if(title==='Avatar'&&item==='AI Eğitmenler')return h`<${AvatarStudio}/>`;return h`<${Generic} title=${title} item=${item}/>`}
function App(){const[active,setActive]=useState('Anasayfa'),[fly,setFly]=useState(null),[item,setItem]=useState(null),[q,setQ]=useState('');useEffect(()=>{window.lucide?.createIcons()},[active,fly,item]);const select=m=>{setActive(m[0]);setItem(m[2]?m[2][0]:null);setFly(m[2]?m[0]:null)};return h`<div className="h-screen flex overflow-hidden"><aside className="w-[250px] shrink-0 bg-[#07111f] text-white flex flex-col shadow-2xl z-50"><div className="h-[82px] px-6 flex items-center border-b border-white/10"><div><div className="text-xl font-black">ONO <span className="text-yellow-400">SMARTFLOW</span></div><div className="text-[9px] tracking-[.2em] text-slate-400 mt-1">EĞİTİM • OPERASYON • GELİŞİM</div></div></div><nav className="p-3 flex-1 overflow-y-auto scroll">${menus.map(m=>h`<button onClick=${()=>select(m)} className=${`w-full px-3 py-3 mb-1 rounded-xl flex items-center justify-between text-sm transition ${active===m[0]?'active':'text-slate-300 hover:bg-white/5 hover:text-white'}`}><span className="flex items-center gap-3"><${I} n=${m[1]} c="w-5 h-5"/>${m[0]}</span>${m[2]?h`<${I} n="chevron-right" c="w-4 text-slate-500"/>`:null}</button>`)}</nav><div className="p-4 border-t border-white/10 flex items-center gap-3"><div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center text-xs font-bold">DG</div><div><b className="text-xs">Sistem Yöneticisi</b><p className="text-[10px] text-slate-500">ONO SmartFlow</p></div></div></aside>${fly&&h`<div className="absolute left-[250px] top-0 bottom-0 w-[290px] bg-[#101c2d] text-white z-40 shadow-2xl fly"><div className="h-[82px] px-5 flex items-center justify-between border-b border-white/10"><div><span className="text-[10px] text-slate-500 uppercase">Modül</span><h2 className="font-bold">${fly}</h2></div><button onClick=${()=>setFly(null)} className="w-8 h-8 rounded-lg hover:bg-white/10"><${I} n="x" c="w-4 mx-auto"/></button></div><div className="p-4 overflow-y-auto scroll h-[calc(100%-82px)]">${(menus.find(m=>m[0]===fly)||[])[2]?.map((x,i)=>h`<button onClick=${()=>{setItem(x);setFly(null)}} className=${`w-full p-3 rounded-xl flex items-center gap-3 text-left text-sm mb-1 ${item===x?'bg-indigo-500/20 text-white':'text-slate-300 hover:bg-white/5'}`}><span className="w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-xs">${i+1}</span>${x}<${I} n="chevron-right" c="w-4 ml-auto text-slate-600"/></button>`)}</div></div>`}<section className="flex-1 min-w-0 flex flex-col"><header className="h-[82px] shrink-0 bg-white/90 backdrop-blur border-b flex items-center justify-between px-5 md:px-7"><div className="relative max-w-xl w-full"><${I} n="search" c="w-4 absolute left-3 top-3.5 text-slate-400"/><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Proje, doküman, Teams ara..." className="w-full bg-slate-100 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none"/></div><div className="flex items-center gap-4 ml-4"><span className="hidden md:flex items-center gap-2 text-xs font-semibold"><i className="w-2 h-2 rounded-full bg-emerald-500"></i>Sistem Aktif</span><span className="hidden md:flex items-center gap-2 text-xs font-semibold"><${I} n="video" c="w-4 text-indigo-500"/>Teams Bağlı</span><button className="relative"><${I} n="bell" c="w-5 text-slate-500"/><b className="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center">3</b></button></div></header><main className="flex-1 overflow-auto p-5 md:p-7 xl:p-8">${active==='Anasayfa'?h`<${Dashboard}/>`:h`<${Module} title=${active} item=${item}/>`}</main></section></div>`}createRoot(document.getElementById('root')).render(h`<${App}/>`);</script></body></html>

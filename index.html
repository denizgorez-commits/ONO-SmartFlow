function Projects(){const[ps,setPs]=useState([['Şirket Tanıtımı','Kurumsal','92','Video','Derya','from-indigo-500 to-violet-600','building-2'],['İş Güvenliği ve Emniyet','Zorunlu Eğitim','78','Video','Mert','from-rose-500 to-orange-500','shield-check'],['Gıda Güvenliği Eğitimi','Zorunlu Eğitim','86','Video + Quiz','Selin','from-emerald-500 to-teal-600','shield-check'],['Mutfak İstasyon Eğitimi','Mutfak','72','Video','Mert','from-amber-500 to-orange-600','chef-hat'],['Servis İstasyon Eğitimi','Servis','88','Video + Quiz','Lara','from-sky-500 to-indigo-600','concierge-bell']]);const[q,setQ]=useState('');const f=ps.filter(p=>p[0].toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')));return h`<div className="fade space-y-6"><div className="rounded-3xl p-7 text-white bg-gradient-to-br from-[#07111f] via-[#142b45] to-[#40536b]"><div className="flex justify-between gap-5"><div><p className="text-xs text-slate-300">ONO SmartFlow / Projeler</p><h1 className="text-3xl font-black mt-2">Eğitim Projeleri</h1><p className="text-sm text-slate-300 mt-2">Tüm eğitimlerini tek merkezden yönet.</p></div><button onClick=${()=>setPs([['Yeni Eğitim','Genel','0','Video','Yeni Eğitmen','from-indigo-500 to-blue-600','sparkles'],...ps])} className="px-5 py-3 rounded-xl bg-yellow-400 text-slate-950 font-black text-sm h-fit">+ Yeni Ekle</button></div></div><div className="bg-white rounded-2xl border p-4"><div className="relative"><${I} n="search" c="w-4 absolute left-3 top-3 text-slate-400"/><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Eğitim projesi ara..." className="w-full bg-slate-50 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none"/></div></div><div className="grid md:grid-cols-2 xl:grid-cols-3 gap-5">${f.map(p=>h`<div className="bg-white rounded-2xl border shadow-sm overflow-hidden"><div className=${`h-28 bg-gradient-to-br ${p[5]} p-5 text-white`}><span className="text-[10px] bg-white/15 px-2 py-1 rounded-full">${p[1]}</span><div className="mt-5 flex gap-2 ite function Module({title,item}){if(title==='Projeler')return h`<${Projects}/>`;if(title==='Avatar'&&item==='AI Eğitmenler')return h`<${Avatar}/>`;if(title==='Avatar'&&item==='Sesler')return h`<${Avatar} voice/>`;if(title==='Teams'&&teamMeta[item])return h`<${Studio} kind="Teams" type=${item} meta=${teamMeta[item]} rows=${teamRows[item]}/>`;if(types[item])return h`<${Studio} kind=${title} type=${item} meta=${types[item]}/>`;return h`<div className="fade"><p className="text-xs text-slate-400">ONO SmartFlow / ${title}${item?' / '+item:''}</p><h1 className="text-3xl font-black mt-2">${item||title}</h1><div className="bg-white rounded-2xl border p-8 mt-6"><h3 className="font-black">${item||title} çalışma alanı</h3><p className="text-sm text-slate-400 mt-2">Bu modül için yönetim ekranı hazırlanıyor.</p></div></div>`}

l h-[calc(100%-82px)]">${(menus.find(m=>m[0]===fly)||[])[2]?.map((x,i)=>h`<button onClick=${()=>{setItem(x);setFly(null)}} className=${`w-full p-3 rounded-xl flex items-center gap-3 text-left text-sm mb-1 ${item===x?'bg-indigo-500/20 text-white':'text-slate-300 hover:bg-white/5'}`}><span className="w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-xs">${i+1}</span>${x}<${I} n="chevron-right" c="w-4 ml-auto text-slate-600"/></button>`)}</div></div>`}<section className="flex-1 min-w-0 flex flex-col"><header className="h-[82px] shrink-0 bg-white/90 backdrop-blur border-b flex items-center justify-between px-5 md:px-7"><div className="relative max-w-xl w-full"><${I} n="search" c="w-4 absolute left-3 top-3.5 text-slate-400"/><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Proje, doküman, Teams ara..." className="w-full bg-slate-100 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none"/></div><div className="flex items-center gap-4 ml-4"><span className="hidden md:flex items-center gap-2 text-xs font-semibold"><i className="w-2 h-2 rounded-full bg-emerald-500"></i>Sistem Aktif</span><span className="hidden md:flex items-center gap-2 text-xs font-semibold"><${I} n="video" c="w-4 text-indigo-500"/>Teams Bağlı</span><button className="relative"><${I} n="bell" c="w-5 text-slate-500"/><b className="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center">3</b></button></div></header><main className="flex-1 overflow-auto p-5 md:p-7 xl:p-8">${active==='Anasayfa'?h`<${Dashboard}/>`:h`<${Module} title=${active} item=${item}/>`}</main></section></div>`}createRoot(document.getElementById('root')).render(h`<${App}/>`);</script></body></html>

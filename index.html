<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>ONO SmartFlow</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f5f7fb;color:#172033}.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:9px}.fly{animation:fly .18s ease-out}@keyframes fly{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}.fade{animation:fade .2s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hero{background:linear-gradient(115deg,#07111f,#172b43 65%,#394b60)}.active{background:linear-gradient(90deg,rgba(251,191,36,.17),rgba(255,255,255,.04));box-shadow:inset 3px 0 #fbbf24}</style></head><body><div id="root"></div><script type="module">import React,{useState,useEffect}from'https://esm.sh/react@18.3.1';import{createRoot}from'https://esm.sh/react-dom@18.3.1/client';import htm from'https://esm.sh/htm@3.1.1';const h=htm.bind(React.createElement);const Icon=({n,c=''})=>h`<i data-lucide=${n} className=${c}></i>`;
const menus=[['Anasayfa','layout-dashboard'],['Eğitimler','graduation-cap',['Tüm Eğitimler','Yeni Eğitim Oluştur','Eğitim Kütüphanesi','Sınavlar','Sertifikalar','Kategoriler']],['Personel','users',['Tüm Personel','Excel ile Aktar','Gruplar','Yetkinlikler','Eğitim Geçmişi']],['Teams','video',['Canlı Eğitimler','Planlananlar','Geçmiş Eğitimler','Toplantı Ayarları']],['Avatar','bot',['AI Eğitmenler','Sesler','Avatar Kütüphanesi','Konuşma Ayarları']],['Marka','palette',['Marka Profilleri','Renkler','Logolar','Fontlar','Şablonlar']],['Uygulamalar','plug',['ChatGPT','HeyGen','Canva','Microsoft Teams','API & Entegrasyonlar']],['Projeler','folder-kanban',['Tüm Projeler','Yeni Klasör','Oryantasyon','Mutfak İstasyon','Servis İstasyon','Gıda Güvenliği']],['Ayarlar','settings',['Genel Ayarlar','Kullanıcılar & Roller','Bildirimler','Güvenlik','Sistem Logları']]];
const rows=[['Gıda Güvenliği V1','Selin (AI)','84 / 120','24:15','Soru-Cevap'],['Mutfak İstasyon','Mehmet','56 / 80','18:40','Devam Ediyor'],['Servis İstasyon','Selin (AI)','72 / 100','12:05','Devam Ediyor'],['Oryantasyon','Ayşe','100 / 150','28:30','Planlandı']];
function Dashboard(){return h`<div className="space-y-6 fade"><div className="hero rounded-3xl p-7 md:p-9 text-white overflow-hidden relative"><div className="absolute -right-20 -top-24 w-80 h-80 rounded-full bg-yellow-400/10 blur-3xl"></div><div className="relative"><p className="text-xs text-slate-300">12 Eylül 2025 • Cuma</p><h1 className="text-3xl md:text-4xl font-black mt-2">Hoş geldin, Deniz 👋</h1><p className="text-slate-300 mt-3 max-w-2xl">Eğitim, personel ve operasyon süreçlerini tek merkezden yönet. Bugün <b className="text-white">12 aktif süreç</b> ve <b className="text-white">84 bekleyen personel</b> var.</p><div className="mt-6 flex gap-3"><button className="px-4 py-2.5 rounded-xl bg-yellow-400 text-slate-950 font-bold text-sm flex gap-2 items-center"><${Icon} n="plus" c="w-4"/>Yeni Eğitim</button><button className="px-4 py-2.5 rounded-xl bg-white/10 font-semibold text-sm">Operasyonu Gör</button></div></div></div><div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">${[['Toplam Lokasyon','520','331 Tavuk Dünyası • 189 Dürümle','map-pin','violet'],['Devam Eden Eğitim','4','2 Teams • 2 AI Avatar','play-circle','cyan'],['Toplam Personel','1,248','Aktif 1,164 • Pasif 84','users','amber'],['Tamamlanma Oranı','78%','Bu ay • hedef %85','circle-check','indigo']].map(x=>h`<div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-lg transition"><div className="flex justify-between"><div><p className="text-xs uppercase tracking-wide font-bold text-slate-400">${x[0]}</p><b className="block text-3xl mt-2">${x[1]}</b><p className="text-xs text-slate-400 mt-2">${x[2]}</p></div><div className=${`w-11 h-11 rounded-xl bg-${x[4]}-50 text-${x[4]}-600 flex items-center justify-center`}><${Icon} n=${x[3]} c="w-5"/></div></div></div>`)}</div><div className="grid grid-cols-1 xl:grid-cols-3 gap-6"><div className="xl:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden"><div className="p-5 border-b flex justify-between"><div><h3 className="font-bold">Devam Eden Eğitimler</h3><p className="text-xs text-slate-400 mt-1">Gerçek zamanlı operasyon</p></div><button className="text-sm text-indigo-600 font-bold">Tümünü Gör →</button></div><div className="overflow-auto"><table className="w-full text-sm"><thead className="bg-slate-50 text-xs text-slate-400"><tr>${['Eğitim','Eğitmen','Katılımcı','Süre','Durum'].map(x=>h`<th className="p-4 text-left">${x}</th>`)}</tr></thead><tbody className="divide-y">${rows.map((r,i)=>h`<tr className="hover:bg-slate-50"><td className="p-4 font-semibold">${r[0]}</td><td className="p-4 text-slate-500">${r[1]}</td><td className="p-4 text-slate-500">${r[2]}</td><td className="p-4 text-slate-500">${r[3]}</td><td className="p-4"><span className=${`px-2.5 py-1 rounded-full text-xs font-semibold ${i===0?'bg-indigo-50 text-indigo-600':i===3?'bg-slate-100 text-slate-500':'bg-emerald-50 text-emerald-600'}`}>${r[4]}</span></td></tr>`)}</tbody></table></div></div><div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5"><h3 className="font-bold">Aylık Eğitim Performansı</h3><p className="text-xs text-slate-400 mt-1">Tamamlanma oranı</p><div className="h-48 flex items-end gap-2 mt-6">${[35,48,61,54,68,64,76,69,78].map((v,i)=>h`<div className="flex-1 h-full flex flex-col justify-end items-center gap-2"><div className="w-full rounded-t-lg bg-gradient-to-t from-indigo-600 to-violet-400" style=${{height:v*2}}></div><span className="text-[9px] text-slate-400">${['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl'][i]}</span></div>`)}</div><div className="border-t mt-4 pt-4 flex justify-between"><b>78%</b><span className="text-xs text-emerald-600">↑ %15</span></div></div></div><div className="grid grid-cols-2 md:grid-cols-3 gap-4">${[['Yeni Eğitim Oluştur','plus-circle'],['Excel ile Personel Aktar','file-up'],['Teams Eğitimi Başlat','video'],['AI Avatar Oluştur','sparkles'],['Duyurular','megaphone']].map(x=>h`<button className="bg-white border border-slate-100 rounded-2xl p-5 text-left shadow-sm hover:-translate-y-1 hover:shadow-lg transition"><${Icon} n=${x[1]} c="w-6 text-indigo-500 mb-3"/><b className="text-sm">${x[0]}</b><p className="text-xs text-slate-400 mt-1">Hızlı işlem</p></button>`)}</div></div>`}
function Module({title,item}){return h`<div className="fade"><div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6"><div><p className="text-xs text-slate-400 mb-2">ONO SmartFlow / ${title}${item?` / ${item}`:''}</p><h1 className="text-3xl font-black">${item||title}</h1><p className="text-sm text-slate-400 mt-2">${title} modülünün profesyonel yönetim alanı.</p></div><div className="flex gap-2"><button className="px-4 py-2.5 bg-white border rounded-xl text-sm font-semibold"><${Icon} n="download" c="w-4 inline mr-2"/>Dışa Aktar</button><button className="px-4 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-semibold"><${Icon} n="plus" c="w-4 inline mr-2"/>Yeni Oluştur</button></div></div><div className="grid md:grid-cols-3 gap-5 mb-6">${[['Toplam','1,248','Kayıt'],['Aktif','84','İşlemde'],['Başarı','78%','Ortalama']].map(x=>h`<div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm"><span className="text-xs text-slate-400">${x[0]}</span><b className="block text-2xl mt-1">${x[1]}</b><small className="text-xs text-emerald-600">${x[2]}</small></div>`)}</div><div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6"><div className="flex items-center gap-3 mb-6"><div className="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><${Icon} n="layers" c="w-5"/></div><div><h3 className="font-bold">${item||title} çalışma alanı</h3><p className="text-xs text-slate-400">Seçtiğin alt menü için işlemler burada açılacak.</p></div></div><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${['Liste Görünümü','Filtrele','Toplu İşlem','Ayarlar'].map((x,i)=>h`<button className="border rounded-xl p-4 text-left hover:bg-slate-50"><${Icon} n=${['list','filter','check-square','settings'][i]} c="w-5 text-indigo-500 mb-3"/><b className="text-sm">${x}</b><p className="text-xs text-slate-400 mt-1">Hazır</p></button>`)}</div></div></div>`}
function App(){const[active,setActive]=useState('Anasayfa'),[fly,setFly]=useState(null),[item,setItem]=useState(null),[q,setQ]=useState('');useEffect(()=>window.lucide?.createIcons(),[active,fly,item]);const select=m=>{setActive(m[0]);setItem(null);setFly(m[2]?m[0]:null)};return h`<div className="h-screen flex overflow-hidden"><aside className="w-[250px] shrink-0 bg-[#07111f] text-white flex flex-col shadow-2xl z-50"><div className="h-[82px] px-6 flex items-center border-b border-white/10"><div><div className="text-xl font-black">ONO <span className="text-yellow-400">SMARTFLOW</span></div><div className="text-[9px] tracking-[.2em] text-slate-400 mt-1">EĞİTİM • OPERASYON • GELİŞİM</div></div></div><nav className="p-3 flex-1 overflow-y-auto scroll">${menus.map(m=>h`<button onClick=${()=>select(m)} className=${`w-full px-3 py-3 mb-1 rounded-xl flex items-center justify-between text-sm transition ${active===m[0]?'active':'text-slate-300 hover:bg-white/5 hover:text-white'}`}><span className="flex items-center gap-3"><${Icon} n=${m[1]} c="w-5 h-5"/>${m[0]}</span>${m[2]?h`<${Icon} n="chevron-right" c="w-4 text-slate-500"/>`:null}</button>`)}</nav><div className="p-4 border-t border-white/10 flex items-center gap-3"><div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center text-xs font-bold">DG</div><div><b className="text-xs">Deniz Görez</b><p className="text-[10px] text-slate-500">Sistem Yöneticisi</p></div></div></aside>${fly&&h`<div className="absolute left-[250px] top-0 bottom-0 w-[290px] bg-[#101c2d] text-white z-40 shadow-2xl fly"><div className="h-[82px] px-5 flex items-center justify-between border-b border-white/10"><div><span className="text-[10px] text-slate-500 uppercase">Modül</span><h2 className="font-bold">${fly}</h2></div><button onClick=${()=>setFly(null)} className="w-8 h-8 rounded-lg hover:bg-white/10"><${Icon} n="x" c="w-4 mx-auto"/></button></div><div className="p-4 overflow-y-auto scroll h-[calc(100%-82px)]">${menus.find(m=>m[0]===fly)[2].map((x,i)=>h`<button onClick=${()=>{setItem(x);setFly(null)}} className=${`w-full p-3 rounded-xl flex items-center gap-3 text-left text-sm mb-1 ${item===x?'bg-indigo-500/20 text-white':'text-slate-300 hover:bg-white/5'}`}><span className="w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-xs">${i+1}</span>${x}<${Icon} n="chevron-right" c="w-4 ml-auto text-slate-600"/></button>`)}</div></div>`}<section className="flex-1 min-w-0 flex flex-col"><header className="h-[82px] shrink-0 bg-white/90 backdrop-blur border-b flex items-center justify-between px-5 md:px-7"><div className="relative max-w-xl w-full"><${Icon} n="search" c="w-4 absolute left-3 top-3.5 text-slate-400"/><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Eğitim, personel, proje ara..." className="w-full bg-slate-100 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none focus:ring-2 focus:ring-indigo-100"/></div><div className="flex items-center gap-4 ml-4"><span className="hidden md:flex items-center gap-2 text-xs font-semibold"><i className="w-2 h-2 rounded-full bg-emerald-500"></i>Sistem Aktif</span><span className="hidden md:flex items-center gap-2 text-xs font-semibold"><${Icon} n="video" c="w-4 text-indigo-500"/>Teams Bağlı</span><button className="relative"><${Icon} n="bell" c="w-5 text-slate-500"/><b className="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center">3</b></button></div></header><main className="flex-1 overflow-auto p-5 md:p-7 xl:p-8">${active==='Anasayfa'?h`<${Dashboard}/>`:h`<${Module} title=${active} item=${item}/>`}</main></section></div>`}createRoot(document.getElementById('root')).render(h`<${App}/>`);</script></body></html>

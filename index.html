<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ONO SmartFlow</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.scrollbar::-webkit-scrollbar{width:7px}.scrollbar::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}</style>
</head><body class="bg-slate-50 text-slate-800"><div id="root"></div>
<script type="module">
import React,{useState,useEffect} from 'https://esm.sh/react@18.3.1';import{createRoot}from'https://esm.sh/react-dom@18.3.1/client';import htm from'https://esm.sh/htm@3.1.1';const html=htm.bind(React.createElement);
const Icon=({name,className=''})=>html`<i data-lucide=${name} className=${className}></i>`;
function Dashboard(){return html`<div className="space-y-6"><div className="grid grid-cols-1 md:grid-cols-3 gap-6">${[['Toplam Hedef Kitle','520','Lokasyon','331 Tavuk Dünyası | 189 Dürümle','circle-check','blue'],['Canlı Teams Eğitimleri','4','','Selin (Avatar) devrede','circle-play','green'],['Atanan Personel','1,248','','84 kişi çağrı bekliyor','users','yellow']].map(x=>html`<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200"><div className="flex justify-between items-start"><div><p className="text-sm text-slate-500 font-medium">${x[0]}</p><h3 className="text-3xl font-bold mt-2">${x[1]}${x[2]&&html`<span className="text-sm font-normal text-slate-400 ml-1">${x[2]}</span>`}</h3><p className=${`text-xs mt-1 ${x[5]==='green'?'text-green-600':x[5]==='yellow'?'text-yellow-600':'text-slate-400'}`}>${x[3]}</p></div><div className=${`p-3 rounded-lg ${x[5]==='blue'?'bg-blue-50 text-blue-600':x[5]==='green'?'bg-green-50 text-green-600':'bg-yellow-50 text-yellow-600'}`}><${Icon} name=${x[4]} className="w-6 h-6"/></div></div></div>`)}</div><div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div className="p-5 border-b flex justify-between items-center"><div><h3 className="font-semibold">Devam Eden Operasyonlar</h3><p className="text-xs text-slate-400 mt-1">Gerçek zamanlı eğitim akışı</p></div><button className="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm flex items-center gap-2"><${Icon} name="plus-circle" className="w-4 h-4"/>Yeni Eğitim Başlat</button></div><table className="w-full text-left"><thead><tr className="bg-slate-50 text-slate-500 text-sm"><th className="p-4">Eğitim Modülü</th><th className="p-4">Süre</th><th className="p-4">Durum</th></tr></thead><tbody className="text-sm divide-y"><tr><td className="p-4 font-medium">Gıda Güvenliği V1</td><td className="p-4">24:15 / 35:00</td><td className="p-4"><span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs">Soru-Cevap Fazı</span></td></tr></tbody></table></div></div>`}
function Upload(){const[f,setF]=useState(null);return html`<div className="max-w-4xl bg-white rounded-xl shadow-sm border p-8"><h3 className="text-xl font-semibold mb-2">Katılımcı Listesi Yükle</h3><p className="text-slate-500 text-sm mb-6">Excel dosyasını (İsim, Soyisim, Telefon) yükleyin.</p><label className="border-2 border-dashed rounded-xl p-12 flex flex-col items-center cursor-pointer hover:bg-slate-50"><${Icon} name="upload" className="w-12 h-12 text-slate-400 mb-4"/><h4 className="text-lg font-medium">${f?f.name:'Dosyayı Sürükleyip Bırakın'}</h4><span className="mt-6 px-6 py-2 bg-slate-900 text-white rounded-lg">Dosya Seç</span><input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange=${e=>setF(e.target.files?.[0])}/></label></div>`}
function Apps(){return html`<div className="grid grid-cols-1 md:grid-cols-3 gap-6">${[['H','HeyGen API','Video Render'],['GPT','OpenAI','Metin & Prompt'],['C','Canva','Tasarım & Sunum']].map(x=>html`<div className="bg-white p-6 rounded-2xl border shadow-sm"><div className="flex justify-between items-start mb-6"><div className="flex items-center"><div className="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center font-bold text-xl mr-4">${x[0]}</div><div><h4 className="font-semibold text-lg">${x[1]}</h4><p className="text-sm text-slate-400">${x[2]}</p></div></div><span className="text-xs text-green-700 bg-green-100 px-2 py-1 rounded-full">Bağlı</span></div><button className="w-full py-2 bg-slate-100 rounded-lg text-sm">Ayarları Yapılandır</button></div>`)}</div>`}
function App(){const[active,setActive]=useState('Anasayfa'),[sub,setSub]=useState(null);const menus={Anasayfa:[],Avatar:['Eğitmenler','Sesler'],Marka:['Renkler','Logolar','Fontlar'],Uygulamalar:['ChatGPT','HeyGen','Canva'],Projeler:['Yeni Klasör','Oryantasyon','Mutfak İstasyon','Servis İstasyon','Gıda Güvenliği']};const ims={Anasayfa:'home',Avatar:'user',Marka:'palette',Uygulamalar:'app-window',Projeler:'folder'};let content=active==='Anasayfa'?html`<${Dashboard}/>`:active==='Projeler'?html`<${Upload}/>`:active==='Uygulamalar'?html`<${Apps}/>`:html`<div className="flex flex-col items-center justify-center h-80 bg-white rounded-2xl border border-dashed"><${Icon} name="settings" className="w-12 h-12 text-slate-300 mb-4"/><h3 className="text-lg font-semibold text-slate-600">${sub||active} modülü hazır</h3></div>`;useEffect(()=>window.lucide?.createIcons(),[active,sub]);return html`<div className="flex h-screen overflow-hidden"><aside className="w-72 bg-slate-900 text-white flex flex-col shadow-xl"><div className="p-6 border-b border-slate-700"><h1 className="text-2xl font-bold text-yellow-500">ONO SMARTFLOW</h1><p className="text-xs text-slate-400 mt-1">AI Destekli Eğitim & Operasyon</p></div><nav className="flex-1 p-4 space-y-2 overflow-y-auto scrollbar">${Object.keys(menus).map(m=>html`<div><button onClick=${()=>{setActive(m);setSub(null)}} className=${`flex justify-between items-center w-full p-3 rounded-lg ${active===m?'bg-slate-700 font-semibold':'hover:bg-slate-800'}`}><div className="flex items-center"><${Icon} name=${ims[m]} className="w-5 h-5 mr-3"/>${m}</div>${active===m&&m!=='Anasayfa'&&html`<${Icon} name="chevron-right" className="w-4 h-4"/>`}</button>${active===m&&menus[m].length>0&&html`<div className="ml-11 mt-2 space-y-1 border-l-2 border-slate-700 pl-3">${menus[m].map(s=>html`<button onClick=${()=>setSub(s)} className=${`block w-full text-left text-sm py-1.5 ${sub===s?'text-yellow-400':'text-slate-300 hover:text-white'}`}>${s}</button>`)}</div>`}</div>`)}</nav><div className="p-4 border-t border-slate-700 text-xs text-slate-400">ONO SmartFlow • Yönetim Paneli</div></aside><section className="flex-1 overflow-auto"><header className="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b sticky top-0 z-10"><h2 className="text-2xl font-semibold">${sub||active} Paneli</h2><span className="text-sm font-medium px-3 py-1 bg-green-100 text-green-700 rounded-full">● Sistem Aktif</span></header><main className="p-8">${content}</main></section></div>`}createRoot(document.getElementById('root')).render(html`<${App}/>`);setTimeout(()=>window.lucide?.createIcons(),100);
</script></body></html>

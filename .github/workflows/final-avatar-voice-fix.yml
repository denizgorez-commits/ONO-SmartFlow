name: Final Avatar Voice Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Avatar submenu navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove the accidental top-level Sesler item. Sesler must exist only under Avatar.
          s=s.replace("['Sesler','volume-2'],", "", 1)
          # Make submenu selection explicitly preserve the parent module.
          s=s.replace("onClick=${()=>{setItem(x);setFly(null)}}", "onClick=${()=>{setActive(fly);setItem(x);setFly(null)}}", 1)
          # Ensure Avatar > Sesler routes to the voice studio.
          marker="function Module({title,item,open}){"
          route="if(title==='Avatar'&&item==='Sesler')return h`<${Avatar} voice/>`;"
          if route not in s:
              # Insert immediately after the Module declaration, before other module routes.
              s=s.replace(marker, marker+route, 1)
          # Use a known Lucide icon name for the Mert voice.
          s=s.replace("['Mert','Erkek • Türkçe','Profesyonel ve net','volume']", "['Mert','Erkek • Türkçe','Profesyonel ve net','volume-2']")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify final state
        run: |
          ! grep -q "\['Sesler','volume-2'\]" index.html
          grep -q "\['Avatar','bot',\['AI Eğitmenler','Sesler'\]\]" index.html
          grep -q "if(title==='Avatar'&&item==='Sesler')return h\`<\${Avatar} voice/>\`;" index.html
          grep -q "setActive(fly);setItem(x);setFly(null)" index.html
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Avatar Sesler submenu navigation'
          rm -f .github/workflows/final-avatar-voice-fix.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary Avatar voice fix workflow'
          git push

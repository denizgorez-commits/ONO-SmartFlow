name: Remove reports menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove report navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(",[\'Raporlar\',\'chart-no-axes-combined\',[\'Genel Raporlar\',\'Eğitim Performansı\',\'Personel Analizi\',\'Katılım Raporları\',\'Excel Dışa Aktar\']]", "")
          s = s.replace(",[\'Raporları İncele\',\'bar-chart-3\']", "")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove reports menu and action"
          git push
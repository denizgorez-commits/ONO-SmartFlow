name: Show Voice Menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direct voice menu
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace(\"const menus=[['Anasayfa','layout-dashboard'],\",\"const menus=[['Anasayfa','layout-dashboard'],['Sesler','volume-2'],\"); s=s.replace(\"function Module({title,item,open}){if(title==='Projeler')\",\"function Module({title,item,open}){if(title==='Sesler')return h`<${Avatar} voice/>`;if(title==='Projeler')\"); p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make voice studio directly accessible" || true
          rm -f .github/workflows/show-voice-menu.yml .github/workflows/fix-avatar-voice.yml
          git add -A
          git commit -m "Remove temporary voice workflows" || true
          git push
